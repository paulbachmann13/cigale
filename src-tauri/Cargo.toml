[package]
name = "cigale"
version = "0.5.0"
description = "Cigale — éditeur PDF local et gratuit"
license = "Apache-2.0"
edition = "2021"

[lib]
name = "cigale_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde_json = "1"

[profile.release]
lto = true
opt-level = "s"
strip = true
