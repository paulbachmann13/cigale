name: CI et déploiement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Licences (aucune GPL / AGPL / « Pro »)
        run: npm run check:licenses
      - run: npm run typecheck
      - name: qpdf (contrôle structurel des PDF produits)
        run: sudo apt-get update && sudo apt-get install -y qpdf
      - name: Tests unitaires
        run: npm test
      - run: npm run fixtures
      # Le téléchargement des navigateurs se bloque parfois : chaque essai est limité à 6 minutes.
      - name: Navigateurs de test
        timeout-minutes: 20
        run: |
          for i in 1 2 3; do
            timeout 360 npx playwright install --with-deps chromium webkit && exit 0
            echo "Téléchargement bloqué, nouvel essai ($i)"
          done
          exit 1
      - name: Tests de bout en bout
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    name: Build GitHub Pages
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          CIGALE_BASE: /cigale/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Déploiement
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
