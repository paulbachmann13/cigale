name: Application Mac et Windows

# Construit Cigale pour Mac (.dmg universel) et pour Windows (installateur .exe, 64 bits).
# À lancer à la main (Actions → Application Mac et Windows : les fichiers sont dans les « Artifacts »)
# ou en poussant une étiquette « v1.4.0 » : les deux applications sont alors publiées ensemble dans les Releases GitHub,
# avec le latest.json que les mises à jour automatiques lisent.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Licences
        run: npm run check:licenses
      - name: Construire le .dmg universel (et l'archive de mise à jour signée)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npm run build:mac
      - name: Préparer les fichiers
        run: |
          B=src-tauri/target/universal-apple-darwin/release/bundle
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          cp "$B"/dmg/*.dmg out/
          cp "$B/macos/Cigale.app.tar.gz" "out/Cigale_${VERSION}_universal.app.tar.gz"
          cp "$B/macos/Cigale.app.tar.gz.sig" "out/Cigale_${VERSION}_universal.app.tar.gz.sig"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Cigale-mac
          path: out/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Licences
        run: npm run check:licenses
      - name: Construire l'installateur Windows (et sa signature de mise à jour)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npm run build:win
      - name: Préparer les fichiers
        shell: bash
        run: |
          B=src-tauri/target/release/bundle/nsis
          mkdir -p out
          cp "$B"/*-setup.exe out/
          cp "$B"/*-setup.exe.sig out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Cigale-windows
          path: out/*
          if-no-files-found: error

  publier:
    needs: [mac, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Publier dans les Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Une étiquette v1.4.0 doit correspondre à la version de package.json.
          if [[ "${{ github.ref_name }}" != "v$VERSION" ]]; then
            echo "L'étiquette ${{ github.ref_name }} ne correspond pas à la version $VERSION" >&2
            exit 1
          fi
          MAC="Cigale_${VERSION}_universal.app.tar.gz"
          WIN="Cigale_${VERSION}_x64-setup.exe"
          test -f "dl/Cigale-mac/$MAC" -a -f "dl/Cigale-windows/$WIN" -a -f "dl/Cigale-windows/$WIN.sig"
          BASE="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          node scripts/make-latest-json.mjs "$VERSION" "dl/Cigale-mac/$MAC.sig" "$BASE/$MAC" CHANGELOG.md \
            "dl/Cigale-windows/$WIN.sig" "$BASE/$WIN" > latest.json
          cat latest.json
          gh release create "${{ github.ref_name }}" dl/Cigale-mac/*.dmg "dl/Cigale-mac/$MAC" "dl/Cigale-windows/$WIN" latest.json \
            --title "Cigale ${{ github.ref_name }}" \
            --notes "Mac (Intel et Apple Silicon) : non signée — au premier lancement, clic droit sur Cigale → Ouvrir, ou Réglages Système → Confidentialité et sécurité → « Ouvrir quand même ». Windows (64 bits) : au premier lancement, « Windows a protégé votre ordinateur » → Informations complémentaires → Exécuter quand même. Les versions suivantes se mettent à jour toutes seules (Fichier → Rechercher les mises à jour…)."
