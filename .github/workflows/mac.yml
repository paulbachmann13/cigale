name: Application Mac

# Construit Cigale.dmg (Mac Intel et Apple Silicon). À lancer à la main (Actions → Application Mac)
# ou en poussant une étiquette « v0.5.0 » : le .dmg est alors publié dans les Releases GitHub.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Licences
        run: npm run check:licenses
      - name: Construire le .dmg universel (et l'archive de mise à jour signée)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npm run build:mac
      - name: Préparer les fichiers à publier
        run: |
          B=src-tauri/target/universal-apple-darwin/release/bundle
          VERSION=$(node -p "require('./package.json').version")
          # Une étiquette v0.5.0 doit correspondre à la version de package.json.
          if [[ "${{ github.ref }}" == refs/tags/v* && "${{ github.ref_name }}" != "v$VERSION" ]]; then
            echo "L'étiquette ${{ github.ref_name }} ne correspond pas à la version $VERSION" >&2
            exit 1
          fi
          mkdir -p out
          cp "$B"/dmg/*.dmg out/
          cp "$B/macos/Cigale.app.tar.gz" "out/Cigale_${VERSION}_universal.app.tar.gz"
          cp "$B/macos/Cigale.app.tar.gz.sig" "out/Cigale_${VERSION}_universal.app.tar.gz.sig"
          node scripts/make-latest-json.mjs "$VERSION" "out/Cigale_${VERSION}_universal.app.tar.gz.sig" \
            "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Cigale_${VERSION}_universal.app.tar.gz" CHANGELOG.md > out/latest.json
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Cigale-mac
          path: out/*
          if-no-files-found: error
      - name: Publier dans les Releases (étiquette v…)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" out/*.dmg out/*.app.tar.gz out/latest.json --title "Cigale ${{ github.ref_name }}" --notes "Application Mac (Intel et Apple Silicon). Non signée : au premier lancement, clic droit sur Cigale → Ouvrir, ou Réglages Système → Confidentialité et sécurité → « Ouvrir quand même ». Les versions suivantes se mettent à jour toutes seules (Fichier → Rechercher les mises à jour…)."
